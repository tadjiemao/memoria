<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palabras de alta frecuencia</title>
<style>
  :root { --bg:#16191e; --fg:#eceef1; color-scheme: dark; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  #stage { padding:0 1.5rem; max-width:40rem; }
  #display { font-size: clamp(3rem, 12vw, 6rem); line-height:1.2; }
  #end { display:none; flex-direction:column; align-items:center; gap:2rem;
       opacity:0; transition:opacity 2s ease; }
  #end.show { opacity:1; }
  #end p { font-size:1.25rem; line-height:1.7; margin:0; text-align:justify; hyphens:auto; }
  #btn {
    font:inherit; font-size:1rem; letter-spacing:.12em;
    color:var(--fg); background:transparent;
    border:2px solid var(--fg); border-radius:0;
    padding:.8rem 2.5rem; cursor:pointer;
  }
  #btn:hover, #btn:focus-visible { background:var(--fg); color:var(--bg); outline:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="display"></div>
  <div id="end">
    <p id="para"></p>
    <button id="btn" type="button">CONTINUAR</button>
  </div>
</div>

<script>
  // ===== Configuración =====
  const WORDS = [
    "NOVELA", "FIGURA", "NOMBRE", "TIERRA", "CABEZA",
    "HOMBRE", "TEATRO", "CIUDAD", "DINERO", "CUERPO"
  ]; // 10 palabras
  const WORD_MS = 500;                 // duración de cada palabra
  const COUNT_MS = 1000;               // duración de cada número
  const BLANK_MS = 1000;               // pantalla vacía tras la última palabra
  const NEXT_PAGE = "video.html";  // página local de destino
  const PARAGRAPH = "A continuación, deberá realizar una tarea cognitiva. Le mostraremos un vídeo en el que los equipos vestidos de negro y de blanco se pasarán el balón entre sus compañeros (del mismo color de camiseta). Usted solo tendrá que observar y <strong>contar cuántas veces se pasa el balón el equipo vestido de blanco en total</strong>. Haga clic en el botón de abajo para continuar.";
  // ==========================

  const display = document.getElementById("display");
  const end = document.getElementById("end");
  document.getElementById("para").innerHTML = PARAGRAPH;
  document.getElementById("btn").addEventListener("click", () => {
    window.location.href = NEXT_PAGE;
  });

  const sequence = [
    ...[3, 2, 1].map(n => ({ text: String(n), ms: COUNT_MS })),
    ...WORDS.map(w => ({ text: w, ms: WORD_MS })),
    { text: "", ms: BLANK_MS }
  ];

  function play(i) {
    if (i >= sequence.length) {
      display.style.display = "none";
      end.style.display = "flex";
	  void end.offsetWidth;          // fuerza el reflujo para que la transición se active
      end.classList.add("show");
      return;
    }
    display.textContent = sequence[i].text;
    setTimeout(() => play(i + 1), sequence[i].ms);
  }
  play(0);
</script>
</body>
</html>
